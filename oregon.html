<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Oregon Trail · MHexeract</title>
<style>
  :root{--grn:#3dff5e;--grn-dim:#1f9e3f;--grn-dark:#0a2b12;--bg:#000}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#000;color:var(--grn);
    font:16px/1.5 "Courier New",ui-monospace,Menlo,Consolas,monospace}
  body{padding:10px 10px calc(14px + env(safe-area-inset-bottom))}
  #crt{max-width:780px;margin:0 auto;position:relative;padding:14px 14px 18px;
    background:#010a03;border:2px solid #123d1d;border-radius:10px;
    text-shadow:0 0 6px rgba(61,255,94,.45);min-height:70vh}
  #crt::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:10px;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
  #art{white-space:pre;overflow-x:auto;font-size:12.5px;line-height:1.25;margin:0 0 10px;color:var(--grn)}
  #text{white-space:pre-wrap;word-wrap:break-word;min-height:120px}
  #menu{margin-top:14px;display:flex;flex-direction:column;gap:7px}
  .mbtn{display:block;width:100%;text-align:left;background:#021507;color:var(--grn);
    border:1px solid #14532a;border-radius:4px;padding:11px 12px;font:inherit;cursor:pointer;
    text-shadow:inherit}
  .mbtn:active,.mbtn:hover{background:var(--grn);color:#021507;text-shadow:none}
  .mbtn:disabled{opacity:.38;cursor:not-allowed}
  .mbtn:disabled:active,.mbtn:disabled:hover{background:#021507;color:var(--grn)}
  #prompt{margin-top:16px}
  #spacebar{display:block;width:100%;background:#021507;color:#b6ffc4;border:1px solid var(--grn-dim);
    border-radius:4px;padding:12px;font:inherit;cursor:pointer;letter-spacing:.04em}
  #spacebar:active{background:var(--grn);color:#021507}
  .cursor{display:inline-block;width:.62em;height:1.05em;background:var(--grn);
    vertical-align:text-bottom;animation:blink 1.06s steps(1) infinite}
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
  #entryrow{margin-top:14px;display:none;gap:8px}
  #entryrow.on{display:flex}
  #entry{flex:1;min-width:0;background:#000;border:1px solid var(--grn-dim);border-radius:4px;
    color:var(--grn);font:inherit;padding:11px;text-transform:none}
  #entryok{background:var(--grn);color:#021507;border:0;border-radius:4px;padding:11px 18px;
    font:inherit;font-weight:700;cursor:pointer}
  #huntzone{margin-top:10px}
  #shoot{display:none;width:100%;background:#3d0a0a;color:#ff6b5e;border:2px solid #a33;
    border-radius:6px;padding:16px;font:inherit;font-size:20px;font-weight:700;cursor:pointer;letter-spacing:.15em}
  #shoot.on{display:block}
  #shoot:active{background:#ff6b5e;color:#200}
  .tiny{font-size:12.5px;color:var(--grn-dim);text-align:center;margin-top:10px}
  @media (max-width:520px){ #art{font-size:10.5px} html,body{font-size:15px} }
</style>
</head>
<body>
<div id="crt">
  <pre id="art"></pre>
  <div id="text"></div>
  <div id="huntzone"><button id="shoot" type="button">* SHOOT *</button></div>
  <div id="menu"></div>
  <div id="entryrow"><input id="entry" autocomplete="off" autocapitalize="words" enterkeyhint="done"><button id="entryok" type="button">OK</button></div>
  <div id="prompt" hidden><button id="spacebar" type="button">Press SPACE BAR to continue <span class="cursor"></span></button></div>
  <p class="tiny">THE OREGON TRAIL — an Apple IIe-style homage. Number keys work too.</p>
</div>
<script>
"use strict";
/* ============================== data ============================== */
const MONTHS=["January","February","March","April","May","June","July",
  "August","September","October","November","December"];
const OCC=[

const LANDMARKS=[

  {name:"South Pass",             miles:932,  type:"sight", art:"pass",

  {name:"Green River Crossing",   miles:989,  type:"river", river:"Green River", base:4.2,
   desc:"You have arrived at the Green River. It is the most\ndangerous crossing on the whole trail — deep, cold,\nand fast, straight off the mountain snowfields."},
  {name:"Fort Bridger",           miles:1025, type:"fort", mult:1.75, shortcut:true,
   desc:"You have arrived at Fort Bridger, Jim Bridger's trading\npost in the valley of Black's Fork. A rough cutoff trail\nleaves here and rejoins the main road far ahead, closer\nto Soda Springs — shorter, but hard on wagons and oxen."},
  {name:"Soda Springs",           miles:1151, type:"sight", art:"soda",
   desc:"Soda Springs! The water bubbles up out of the ground\ntasting of soda, and a steamboat-shaped geyser spouts\nnearby. The oxen drink their fill of the strange water."},
  {name:"Fort Hall",              miles:1190, type:"fort", mult:2,
   desc:"You have arrived at Fort Hall, a Hudson's Bay Company\npost on the Snake River plain. Beyond here the trail\ngrows rough and water grows scarce."},
  {name:"Snake River Crossing",   miles:1372, type:"river", river:"Snake River", base:3.6, guide:true,
   desc:"You have arrived at the Snake River. Shoshone Indians\ncamp nearby and know every ford and eddy of this wide,\ntreacherous river."},
  {name:"Fort Boise",             miles:1495, type:"fort", mult:2.25,
   desc:"You have arrived at Fort Boise, a small Hudson's Bay\npost near the Boise River. The Blue Mountains loom\nahead — you must cross them before the snows come."},
  {name:"Blue Mountains",         miles:1694, type:"sight", art:"mountains",
   desc:"You are crossing the Blue Mountains. The trail climbs\nthrough pine forest and steep canyons. Every mile west\nis a mile closer to the Willamette Valley."},
  {name:"Fort Walla Walla",       miles:1786, type:"fort", mult:2.5,
   desc:"You have arrived at Fort Walla Walla, on the Columbia\nRiver. Below here the river runs swift to The Dalles,\nwhere you must choose how to finish the journey."},
  {name:"The Dalles",             miles:1841, type:"sight", dalles:true,
   desc:"You have reached The Dalles. The Columbia River here\nboils through narrow rock channels — too rough for a\nwagon. From here you must choose: raft the river, or\npay the toll on the Barlow Road around Mount Hood."},
  {name:"Willamette Valley, Oregon", miles:2040, type:"end"},
];
const ITEMS=[
  {id:"oxen",    name:"Oxen",       price:40,   unit:"per yoke (2 oxen)",
   blurb:"You will need oxen to pull your wagon."},
  {id:"food",    name:"Food",       price:0.20, unit:"per pound",
   blurb:"Flour, bacon, coffee, sugar — the plainer, the better."},
  {id:"clothing",name:"Clothing",   price:10,   unit:"per set",
   blurb:"Good wool clothing wears best on the trail."},
  {id:"bullets", name:"Ammunition", price:2,    unit:"per box (20 bullets)",
   blurb:"For hunting game and protection on the trail."},
  {id:"wheel",   name:"Wagon wheel",price:10,   unit:"each",
   blurb:"Spare parts save days when something breaks."},
  {id:"axle",    name:"Wagon axle", price:10,   unit:"each", blurb:""},
  {id:"tongue",  name:"Wagon tongue",price:10,  unit:"each", blurb:""},
];
const PARTNAME={wheel:"wagon wheel", axle:"wagon axle", tongue:"wagon tongue"};
const DEFAULT_NAMES=["Amos","Mary","Elizabeth","Samuel","Ruth"];
const DISEASES=["cholera","dysentery","typhoid fever","measles"];

/* ============================== art ============================== */
const ART={
title:
" ___________________________________________\n"+

chimney:

rabbit:

squirrel:

};
const ANIMALS=[
  {id:"squirrel", name:"squirrel", meat:2,   window:900,  base:0.55},
  {id:"rabbit",   name:"rabbit",   meat:6,   window:1200, base:0.62},
  {id:"deer",     name:"deer",     meat:55,  window:1800, base:0.72},
  {id:"bear",     name:"bear",     meat:180, window:1500, base:0.60},
  {id:"buffalo",  name:"buffalo",  meat:450, window:2300, base:0.82},
];

/* ============================== state ============================== */
const SAVE_KEY="oregon.iie.state", BEST_KEY="oregon.iie.best";
let S=null;
function newGame(){
  return { occ:null, mult:1, money:0, party:[], date:{m:3,d:1}, days:0,
    miles:0, lm:1, oxen:0, food:0, clothing:0, bullets:0,
    parts:{wheel:0,axle:0,tongue:0}, pace:"steady", rations:"filling",
    weather:"fair", rainUp:false, grassBad:0, riverDepth:0, riverWidth:0,
    pendingDeaths:[], over:false, won:false, started:false, morale:70, guideDays:0 };
}
function save(){ try{ if(S && !S.over) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function loadSave(){ try{ const r=localStorage.getItem(SAVE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function bestScore(){ try{ return +localStorage.getItem(BEST_KEY)||0; }catch(e){ return 0; } }
function setBest(v){ try{ localStorage.setItem(BEST_KEY, String(v)); }catch(e){} }

/* ============================== utils ============================== */
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const money=v=>"$"+(Math.round(v*100)/100).toFixed(2).replace(/\.00$/,"");
const alive=()=>S.party.filter(p=>p.alive);
const leader=()=>S.party[0];
function hpWord(hp){ return hp>=70?"good":hp>=45?"fair":hp>=25?"poor":"very poor"; }
function partyHealth(){ const a=alive(); if(!a.length) return "very poor";
  return hpWord(a.reduce((t,p)=>t+p.hp,0)/a.length); }
function morale(){ if(S.morale==null) S.morale=70; return S.morale; }
function addMorale(d){ S.morale=clamp(morale()+d,0,100); }
function moraleWord(){ const m=morale(); return m>=75?"high":m>=50?"steady":m>=30?"low":"miserable"; }
function guideLeft(){ if(S.guideDays==null) S.guideDays=0; return S.guideDays; }
function dateStr(){ return MONTHS[S.date.m-1]+" "+S.date.d+", 1848"; }
function addDay(){
  S.days++; S.date.d++;
  if(guideLeft()>0) S.guideDays--;
  const dim=[31,29,31,30,31,30,31,31,30,31,30,31][S.date.m-1];
  if(S.date.d>dim){ S.date.d=1; S.date.m++; }
}
function nextLM(){ return LANDMARKS[S.lm]; }
function milesToNext(){ return Math.max(0, Math.round(nextLM().miles - S.miles)); }
function eatDay(){
  const per={filling:3, meager:2, "bare bones":1}[S.rations];
  const need=alive().length*per;
  if(S.food>=need){ S.food-=need;
    if(S.rations==="filling") addMorale(1); else if(S.rations==="bare bones") addMorale(-2);
    return true; }
  S.food=0; addMorale(-4); return false;
}
function hurt(member, amt, cause){
  member.hp-=amt; if(cause) member.sick=cause;
  if(member.hp<=0 && member.alive){ member.alive=false; member.hp=0;
    S.pendingDeaths.push({name:member.name, cause:cause||member.sick||"exhaustion"}); addMorale(-12); }
}
function pickWeather(){
  const m=S.date.m, mtn=S.miles>=1150, t=Math.random();
  if(mtn && m===9){            /* high country, early autumn: first snows */
    S.weather = t<0.10?"snowing":t<0.30?"cold":t<0.55?"cool":"fair";
  }
  else if(mtn && m===10){      /* high country, late autumn: snow settles in */
    S.weather = t<0.08?"blizzard":t<0.30?"snowing":t<0.48?"very cold":t<0.72?"cold":"fair";
  }
  else if(m>=11||m<=2){ S.weather = t<0.45?"very cold":t<0.6?"snowing":t<0.8?"cold":"fair";
    if(mtn && S.weather==="snowing" && Math.random()<0.3) S.weather="blizzard"; }
  else if(m>=3&&m<=5){ S.weather = t<0.22?"rainy":t<0.32?"thunderstorm":t<0.47?"cool":t<0.88?"fair":"warm"; }
  else if(m>=6&&m<=8){ S.weather = t<0.10?"rainy":t<0.20?"thunderstorm":t<0.38?"warm":t<0.50?"very hot":(t<0.60&&!mtn)?"heat wave":"fair"; }
  else { S.weather = t<0.2?"rainy":t<0.45?"cool":t<0.55?"cold":"fair"; }
  if(mtn&&(S.weather==="rainy")&&m>=9) S.weather="snowing";
  S.rainUp = S.weather==="rainy"||S.weather==="thunderstorm";
}

/* ============================== screen engine ============================== */
let UI={menu:[], cont:null, entry:null};
let BTNS=[];
function setScreen(o){
  UI={menu:o.menu||[], cont:o.cont||null, entry:o.entry||null};
  BTNS=UI.menu;
  $("art").textContent=o.art||"";
  $("art").style.display=o.art?"block":"none";
  $("text").innerHTML=(o.lines||[]).join("\n");
  const menu=$("menu"); menu.innerHTML="";
  UI.menu.forEach((b,i)=>{
    const btn=document.createElement("button");
    btn.type="button"; btn.className="mbtn";
    btn.textContent=(i+1)+".  "+b.label;
    if(b.disabled) btn.disabled=true;
    btn.addEventListener("click",()=>{ if(!btn.disabled) b.fn(); });
    menu.appendChild(btn);
  });
  const er=$("entryrow");
  if(UI.entry){ er.classList.add("on"); const inp=$("entry");
    inp.value=UI.entry.value||""; inp.placeholder=UI.entry.placeholder||"";
    inp.inputMode=UI.entry.numeric?"numeric":"text";
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} },30);
  } else er.classList.remove("on");
  $("prompt").hidden=!UI.cont;
  $("shoot").classList.remove("on");
  save();
}
function entryOk(){
  if(!UI.entry) return;
  const v=$("entry").value; const fn=UI.entry.onSubmit; UI.entry=null;
  $("entryrow").classList.remove("on"); fn(v);
}
$("entryok").addEventListener("click", entryOk);
$("entry").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); entryOk(); } });
$("spacebar").addEventListener("click", ()=>{ if(UI.cont){ const f=UI.cont; UI.cont=null; f(); } });
document.addEventListener("keydown", e=>{
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  if(HUNT.active){ if(e.code==="Space"||e.code==="KeyB"){ e.preventDefault(); huntShoot(); } return; }
  if(UI.cont&&(e.code==="Space"||e.key==="Enter")){ e.preventDefault(); const f=UI.cont; UI.cont=null; f(); return; }
  if(/^[1-9]$/.test(e.key)){ const b=UI.menu[+e.key-1]; if(b&&!b.disabled) b.fn(); }
});

/* ============================== setup screens ============================== */
function titleScreen(){
  S=S||newGame();
  const sv=loadSave();
  const menu=[
    {label:"Travel the trail", fn:()=>{ S=newGame(); occScreen(); }},
    {label:"Learn about the trail", fn:learnScreen},
  ];
  if(sv && sv.started && !sv.over)
    menu.push({label:"Continue your journey ("+sv.party[0].name+"'s party, "+Math.round(sv.miles)+" miles)", fn:()=>{ S=sv; travelScreen(); }});
  if(bestScore()>0)
    menu.push({label:"See the best score so far: "+bestScore(), fn:()=>titleScreen()});
  setScreen({ art:ART.title, lines:[
    "",
    "          T H E   O R E G O N   T R A I L",
    "           ~  4 T H   E D I T I O N  ~",
    "",
    "You may:",
    "",
  ], menu });
}
function learnScreen(){
  setScreen({ lines:[
    "ABOUT THE TRAIL",
    "",
    "The year is 1848. You and your family have sold",
    "nearly everything you own to make the journey west",
    "to the Willamette Valley of Oregon — 2,040 miles",
    "of prairie, river, desert and mountain.",
    "",
    "HOW TO PLAY",
    " * Buy supplies before you leave Independence.",
    "   Food, oxen and spare parts are life itself.",
    " * Travel each day, watching your food and health.",
    " * Rivers must be crossed — ford them, float your",
    "   wagon, pay a ferry, or wait for lower water.",
    " * Hunt to add meat, but you can only carry 100",
    "   pounds of it back to the wagon.",
    " * Weather rules the trail: heat waves, thunder-",
    "   storms and early mountain snow can slow you,",
    "   sicken you, or cost you dearly.",
    " * At the forts you can hire a trail guide — a",
    "   quicker pace and a safer eye at the rivers,",
    "   for as long as his days last.",
    " * Reach Oregon before winter. Snow in the",
    "   mountains has ended many a journey — and if",
    "   December 31 comes, the trail ends with it.",
    "",
    "Good luck. You will need it.",
  ], cont:()=>titleScreen() });
}
function occScreen(){
  setScreen({ lines:[
    "Many kinds of people made the trip to Oregon.",
    "",
    "You may:",
    "",
  ], menu: OCC.map(o=>({ label:o.name+" — "+money(o.money),
    fn:()=>{ S.occ=o.id; S.mult=o.mult; S.money=o.money; nameScreen(0); } })) });
}
function nameScreen(i){
  const prompts=[
    "What is the first name of the wagon leader?",
    "What is the first name of the second party member?",
    "What is the first name of the third party member?",
    "What is the first name of the fourth party member?",
    "What is the first name of the last party member?",
  ];
  const lines=["The members of your party are:"];
  S.party.forEach((p,j)=>lines.push("  "+(j+1)+". "+p.name));
  lines.push("", prompts[i], "", "(Leave it blank to use: "+DEFAULT_NAMES[i]+")");
  setScreen({ lines, entry:{ placeholder:DEFAULT_NAMES[i], value:"",
    onSubmit:v=>{
      const name=(v||"").trim()||DEFAULT_NAMES[i];
      S.party.push({name:name.slice(0,16), hp:100, alive:true, sick:null});
      if(i<4) nameScreen(i+1); else monthScreen();
    } } });
}
function monthScreen(){
  const months=[["March",3],["April",4],["May",5],["June",6],["July",7]];
  setScreen({ lines:[
    "It is 1848. Your jumping-off place is Independence,",
    "Missouri. You must decide which month to leave.",
    "",
    "Leaving in March means mud and cold rivers swollen",
    "with snowmelt. Leaving in July means little grass",
    "left for the oxen — and winter waiting in the",
    "mountains if you are slow.",
    "",
  ], menu: months.map(([n,m])=>({ label:n+" 1848",
    fn:()=>{ S.date={m:m,d:1}; storeIntro(); } })) });
}
function storeIntro(){
  setScreen({ lines:[
    "Before leaving Independence you should buy",
    "equipment and supplies. You have "+money(S.money)+" in",
    "cash, and this storekeeper — Matt — is happy to",
    "sell you what you need. He says:",
    "",
    "\"I can fix you up mighty fine. I recommend at",
    "least 3 yoke of oxen — that's 6 oxen — to pull",
    "your wagon. About 200 pounds of food per person",
    "is none too much. Clothing: 2 sets for each",
    "person. And don't forget spare wagon parts —",
    "a broken wheel a thousand miles from anywhere",
    "is a sorrowful thing.\"",
  ], cont:()=>storeScreen("matt") });
}
/* storeCtx: "matt" at Independence, or a LANDMARKS fort object */
function storeScreen(ctx){
  const fort = ctx==="matt" ? null : ctx;
  const mult = fort ? fort.mult : 1;
  const storeName = fort ? "the store at "+fort.name : "Matt's General Store";
  const lines=[
    "Welcome to "+storeName+".",
    fort ? "Prices out here are higher than back east." : "",
    "",
    "You have "+money(S.money)+".",
    "Your wagon now holds:",
    "   Oxen: "+S.oxen+"    Food: "+Math.round(S.food)+" pounds",
    "   Clothing: "+S.clothing+" sets    Bullets: "+S.bullets,
    "   Spare wheels: "+S.parts.wheel+"  axles: "+S.parts.axle+"  tongues: "+S.parts.tongue,
    "",
    "What would you like to buy?",
    "",
  ];
  const menu=ITEMS.map(it=>({ label:it.name+" — "+money(it.price*mult)+" "+it.unit,
    fn:()=>buyScreen(ctx,it,mult) }));
  if(fort){
    const gPrice=Math.round(20*mult);
    if(guideLeft()>0)
      menu.push({ label:"Trail guide already hired ("+guideLeft()+" days left)", disabled:true, fn:()=>{} });
    else
      menu.push({ label:"Hire a trail guide — "+money(gPrice)+" (14 days)", disabled:S.money<gPrice,
        fn:()=>{ S.money-=gPrice; S.guideDays=14;
          setScreen({ lines:[
            "You hire a weathered mountain man who knows",
            "every ford, mudhole and cutoff between here",
            "and the far country. For 14 days he rides",
            "with your wagon:",
            "",
            " * a quicker pace on the trail,",
            " * a practiced eye at the river crossings —",
            "   safer fords, and less chance of drowning.",
            "",
            "When his 14 days are up, he rides his own way.",
          ], cont:()=>storeScreen(ctx) });
        } });
  }
  menu.push({ label: fort ? "Leave the store" : "Leave the store and start down the trail",
    fn:()=>{
      if(!fort){
        if(S.oxen<2){
          setScreen({ lines:["Matt shakes his head slowly.",
            "",
            "\"Friend, with fewer than one yoke of oxen your",
            "wagon isn't going anywhere at all.\"",""],
            menu:[ {label:"Go back and buy oxen", fn:()=>storeScreen(ctx)},
                   {label:"Leave anyway (the wagon will not move)", fn:()=>{ S.started=true; travelScreen(); }} ] });
          return;
        }
        S.started=true; travelScreen(["You leave Independence, Missouri, and point",
          "your wagon west. Oregon is 2,040 miles away."]);
      } else travelScreen();
    }});
  setScreen({ art: fort?ART.fort:"", lines, menu });
}
function buyScreen(ctx, it, mult){
  const price=it.price*mult;
  const lines=[
    it.name+" — "+money(price)+" "+it.unit+".",
    it.blurb||"",
    "You have "+money(S.money)+".",
    "",
    "How many do you want to buy? (0 to cancel)",
  ];
  setScreen({ lines, entry:{ numeric:true, placeholder:"0", value:"",
    onSubmit:v=>{
      let n=Math.floor(Math.abs(+v)||0);
      const cost=n*price;
      if(n===0){ storeScreen(ctx); return; }
      if(cost>S.money){
        setScreen({ lines:["You only have "+money(S.money)+" — that is not enough for "+n+"."],
          cont:()=>buyScreen(ctx,it,mult) });
        return;
      }
      S.money-=cost;
      if(it.id==="oxen") S.oxen+=n*2;
      else if(it.id==="food") S.food+=n;
      else if(it.id==="clothing") S.clothing+=n;
      else if(it.id==="bullets") S.bullets+=n*20;
      else S.parts[it.id]+=n;
      storeScreen(ctx);
    } } });
}

/* ============================== travel hub ============================== */
function statusLines(){
  return [
    "Date:          "+dateStr(),
    "Weather:       "+S.weather,
    "Health:        "+partyHealth(),
    "Morale:        "+moraleWord(),
    ...(guideLeft()>0?["Guide:         hired ("+guideLeft()+" days left)"]:[]),
    "Food:          "+Math.round(S.food)+" pounds",
    "Next landmark: "+nextLM().name+", "+milesToNext()+" miles",
    "Miles traveled: "+Math.round(S.miles),
  ];
}
function travelScreen(extra){
  pickWeather();
  setScreen({ lines:[].concat(extra||[], statusLines(), ["", "You may:"]),
    menu:[
      {label:"Continue on the trail", fn:continueTrail},
      {label:"Check supplies", fn:suppliesScreen},
      {label:"Look at the map", fn:mapScreen},
      {label:"Change pace", fn:paceScreen},
      {label:"Change food rations", fn:rationsScreen},
      {label:"Stop to rest", fn:restScreen},
      {label:"Attempt to trade", fn:tradeScreen},
      {label:"Hunt for food", fn:()=>startHunt()},
    ] });
}
function suppliesScreen(){
  const lines=[
    "YOUR SUPPLIES",
    "",
    "Oxen:          "+S.oxen,
    "Food:          "+Math.round(S.food)+" pounds",
    "Clothing:      "+S.clothing+" sets",
    "Bullets:       "+S.bullets,
    "Wagon wheels:  "+S.parts.wheel,
    "Wagon axles:   "+S.parts.axle,
    "Wagon tongues: "+S.parts.tongue,
    "Money left:    "+money(S.money),
    ...(guideLeft()>0?["Trail guide:   hired ("+guideLeft()+" days left)"]:[]),
    "",
    "YOUR PARTY",
  ];
  S.party.forEach(p=>lines.push("  "+p.name+": "+(p.alive?hpWord(p.hp)+" health"+(p.sick?" (sick: "+p.sick+")":""):"dead")));
  setScreen({ lines, cont:()=>travelScreen() });
}
function mapScreen(){
  const lines=["THE TRAIL WEST",""];
  LANDMARKS.forEach((l,i)=>{
    let mark="   ";
    if(l.miles<S.miles-1) mark=" * ";
    if(i===S.lm) mark="==>";
    lines.push(mark+" "+l.name.padEnd(30," ")+" "+l.miles+" miles");
  });
  lines.push("", "You have traveled "+Math.round(S.miles)+" miles of 2,040.");
  setScreen({ lines, cont:()=>travelScreen() });
}
function paceScreen(){
  const cur={steady:"Your oxen travel at a walking pace, day after day.",
    strenuous:"A faster pace. Harder on the oxen and on you.",
    grueling:"You push from dawn to dark. The miles come fast — so does exhaustion."};
  setScreen({ lines:["Your pace is now: "+S.pace.toUpperCase(), "", cur[S.pace], "", "Change it to:"],
    menu:["steady","strenuous","grueling"].map(p=>({ label:p[0].toUpperCase()+p.slice(1),
      fn:()=>{ S.pace=p; travelScreen(); } })) });
}
function rationsScreen(){
  const cur={filling:"Meals are generous. 3 pounds of food per person each day.",
    meager:"Meals are lean. 2 pounds of food per person each day.",
    "bare bones":"Meals are very thin. 1 pound of food per person each day."};
  setScreen({ lines:["Your food rations are now: "+S.rations.toUpperCase(), "", cur[S.rations], "", "Change them to:"],
    menu:["filling","meager","bare bones"].map(p=>({ label:p[0].toUpperCase()+p.slice(1),
      fn:()=>{ S.rations=p; travelScreen(); } })) });
}
function restScreen(){
  setScreen({ lines:["How many days will you rest?","",
    "Resting restores health, but the party still eats,","and winter does not wait."],
    menu:[1,2,3].map(d=>({ label:"Rest "+d+" day"+(d>1?"s":""), fn:()=>{
      const log=[];
      for(let i=0;i<d;i++){ addDay(); const fed=eatDay();
        alive().forEach(p=>{ p.hp=clamp(p.hp+(p.sick?3:7),0,100); }); addMorale(3);
        if(!fed) log.push("There is no food to eat, even resting.");
        log.push("You rest a day. ("+dateStr()+")");
        if(checkDeaths(()=>travelScreen(log))) return;
      }
      afterAction(()=>travelScreen(log));
    } })) });
}
function tradeScreen(){
  addDay(); eatDay();
  if(Math.random()<0.35){
    afterAction(()=>travelScreen(["You ride out looking for someone to trade with,",
      "but you see no one. The day is gone."]));
    return;
  }
  const offers=[
    {txt:"An emigrant offers you 1 ox for 50 pounds of food.",
     can:()=>S.food>=50, do:()=>{ S.food-=50; S.oxen+=1; return "You make the trade. The ox looks strong."; }},
    {txt:"A trapper offers you 40 bullets for 1 set of clothing.",
     can:()=>S.clothing>=1, do:()=>{ S.clothing-=1; S.bullets+=40; return "You make the trade."; }},
    {txt:"An Indian offers you 60 pounds of dried meat for 2 sets of clothing.",
     can:()=>S.clothing>=2, do:()=>{ S.clothing-=2; S.food+=60; return "You make the trade. The meat is good."; }},
    {txt:"A passing family, down on their luck, offers 100 pounds of food for $15.",
     can:()=>S.money>=15, do:()=>{ S.money-=15; S.food+=100; return "You make the trade. They thank you kindly."; }},
    {txt:"A trader offers you a spare wagon wheel for 30 pounds of food.",
     can:()=>S.food>=30, do:()=>{ S.food-=30; S.parts.wheel+=1; return "You make the trade."; }},
  ];
  const o=pick(offers);
  setScreen({ lines:["Someone is willing to trade.","", o.txt],
    menu:[
      {label:"Make the trade", disabled:!o.can(), fn:()=>{ const m=o.do(); afterAction(()=>travelScreen([m])); }},
      {label:"No, thank you", fn:()=>afterAction(()=>travelScreen(["You decide to keep what you have."]))},
    ] });
}

/* ---- after any day-consuming action: deaths, then winter check ---- */
function afterAction(next){
  if(checkDeaths(next)) return;
  if(winterCheck(next)) return;
  next();
}
function checkDeaths(next){
  if(!S.pendingDeaths.length) return false;
  const d=S.pendingDeaths.shift();
  const allDead=alive().length===0, leaderDead=!leader().alive;
  setScreen({ art:ART.grave, lines:[
    d.name+" has died of "+d.cause+".",
    "",
    "You stop the wagon and dig a grave beside the trail.",
    "You carve a marker:",
    "",
    "        HERE LIES "+d.name.toUpperCase(),
    "        DIED "+dateStr().toUpperCase()+"",
    "        AGED IN HARD MILES",
  ], cont:()=>{
    if(allDead||leaderDead) return gameOver(leaderDead && !allDead
      ? leader().name+", the wagon leader, has died. Without a leader, the party can go no farther."
      : "Your whole party has perished on the trail.");
    checkDeaths(next)||next();
  }});
  return true;
}
function winterCheck(){
  if(S.date.m>=13 || (S.date.m===12&&S.date.d>=31)){
    gameOver("December 31, 1848 has come, and you are still on the trail.\nThe snows close the passes. Your journey ends here.");
    return true;
  }
  if(S.date.m>=11 && S.miles>1190 && Math.random()<0.04){
    gameOver("A blizzard howls down out of the mountains and buries\nthe trail in snow. Your party is caught in the open,\nfar from any shelter.");
    return true;
  }
  return false;
}
function gameOver(why){
  S.over=true; clearSave();
  const lines=["", why, "",
    "You traveled "+Math.round(S.miles)+" miles in "+S.days+" days.",
    alive().length+" of your party of "+S.party.length+" still live."];
  setScreen({ art:ART.grave, lines,
    menu:[{label:"Try the trail again", fn:()=>{ S=newGame(); titleScreen(); }}] });
}

/* ============================== one day on the trail ============================== */
function oneDay(){
  /* returns: "ok" | "landmark" | "event" (event text in S.eventLines) */
  if(S.oxen<2){ S.eventLines=["Your wagon cannot move — you have fewer than",
    "one yoke of oxen to pull it. Without oxen, here",
    "the journey must end."]; return "stranded"; }
  pickWeather();
  addDay();
  let mph={steady:15, strenuous:20, grueling:25}[S.pace];
  mph*=R(0.8,1.15);
  if(S.grassBad>0){ mph*=0.6; S.grassBad--; }
  if(S.weather==="snowing"||S.weather==="very cold") mph*=0.55;
  if(S.weather==="rainy") mph*=0.8;
  if(S.weather==="blizzard") mph*=0.3;
  if(S.weather==="thunderstorm") mph*=0.65;
  if(S.weather==="heat wave") mph*=0.85;
  if(guideLeft()>0) mph*=1.1;
  if(S.oxen<4) mph*=0.8;
  S.miles+=mph;
  const fed=eatDay();
  /* health drift */
  alive().forEach(p=>{
    let d=0;
    if(S.rations==="filling") d+=0.6; else if(S.rations==="bare bones") d-=1.6;
    if(S.pace==="strenuous") d-=0.7; else if(S.pace==="grueling") d-=2.2;
    if(!fed) d-=6;
    if(p.sick) d-=7;
    if(S.weather==="very cold"||S.weather==="snowing") d-=1.2;
    if(S.weather==="very hot") d-=0.8;
    if(S.weather==="blizzard") d-=3;
    if(S.weather==="heat wave") d-=1.6;
    if(S.weather==="thunderstorm") d-=0.2;
    if(morale()>=75) d+=0.4; else if(morale()<30) d-=1.2;
    if(morale()<15) d-=1.0;
    p.hp=clamp(p.hp+d,0,100);
    if(p.sick && Math.random()<0.30){ if(!DISEASES.includes(p.sick)) p.sick=null;
      else if(Math.random()<0.5) p.sick=null; }
    if(p.hp<=0) hurt(p,0,p.sick||"exhaustion");
  });
  if(S.miles>=nextLM().miles){ S.miles=nextLM().miles; return "landmark"; }
  if(S.pendingDeaths.length) return "ok";
  if(Math.random()<0.16) return "event";
  return "ok";
}
function continueTrail(){
  let guard=0;
  while(guard++<30){
    const r=oneDay();
    if(r==="stranded"){ gameOver(S.eventLines.join("\n")); return; }
    if(checkDeaths(()=>continueTrail())) return;
    if(winterCheck()) return;
    if(r==="landmark"){ arriveLandmark(); return; }
    if(r==="event"){ runEvent(); return; }
  }
  travelScreen();
}
function arriveLandmark(){
  const lm=nextLM();
  if(lm.type==="end"){ winGame(); return; }
  addMorale(6);
  if(lm.type==="river"){ setupRiver(lm); return; }
  if(lm.dalles){ dallesScreen(lm); return; }
  S.lm++;
  const menu=[
    {label:"Continue on the trail", fn:()=>travelScreen()},
    {label:"Stop to rest", fn:restScreen},
  ];
  if(lm.type==="fort")
    menu.unshift({label:"Buy supplies at the fort store", fn:()=>storeScreen(lm)});
  if(lm.shortcut)
    menu.splice(1,0,{label:"Take the cutoff shortcut toward Soda Springs", fn:shortcutChoice});
  setScreen({ art: lm.art?ART[lm.art]:(lm.type==="fort"?ART.fort:""),
    lines:[lm.desc||("You have arrived at "+lm.name+"."), "",
      "Date: "+dateStr()+"   Miles traveled: "+Math.round(S.miles)],
    menu });
}
function shortcutChoice(){
  const lines=["You take the rough cutoff trail. It is dry and",
    "rutted, but it cuts many miles off the journey."];
  if(Math.random()<0.35){
    if(S.oxen>2){ S.oxen-=1; lines.push("","The dry trail is hard on the oxen — one of them",
      "gives out and has to be left behind."); }
    else { alive().forEach(p=>hurt(p,6)); lines.push("","Short of water, the party suffers in the heat."); }
  }
  S.miles=Math.max(S.miles, 1081);
  afterAction(()=>travelScreen(lines));
}

/* ============================== random events ============================== */
function stormEvent(){
  const lines=["A thunderstorm breaks over the plains — rain in",
    "sheets, and lightning walking across the sky."];
  if(Math.random()<0.45 && S.oxen>2){ S.oxen--;
    lines.push("","The oxen stampede at a thunderclap. By the time",
      "you round them up in the dark and the rain, one",
      "of them is gone for good.",
      "","You have "+S.oxen+" oxen left.");
  } else { addDay(); eatDay();
    lines.push("","You huddle under the wagon until it blows over.",
      "The trail is a river of mud. You lose a day.");
  }
  addMorale(-2);
  setScreen({ lines, cont:()=>{ afterAction(()=>travelScreen()); } });
}
function blizzardEvent(){
  addDay(); eatDay(); addMorale(-3);
  alive().forEach(p=>hurt(p,4));
  setScreen({ lines:["Snow comes sideways out of the mountains — a",
    "blizzard that swallows the trail whole. You",
    "huddle in the lee of the wagon, feeding the",
    "oxen from the wagon bed, and wait it out.",
    "",
    "A day is lost, and everyone is chilled through."],
    cont:()=>{ afterAction(()=>travelScreen()); } });
}
function heatChoice(){
  showChoice(
    ["The sun stands straight overhead and the heat",
     "shimmers off the plains. The oxen hang their",
     "heads; there is no shade and no wind."],
    [ { label:"Rest in what shade there is until evening", fn:()=>{ addDay(); eatDay(); addMorale(2);
          alive().forEach(p=>{ p.hp=clamp(p.hp+3,0,100); });
          return ["You rig the wagon canvas for shade and wait",
            "out the worst of the heat. The party rests,",
            "and no one falls sick from the sun."]; } },
      { label:"Push on through the heat", fn:()=>{ alive().forEach(p=>hurt(p,5)); addMorale(-3);
          const g=RI(6,10); S.miles+=g;
          return ["You push on under the white sun. The miles",
            "come — "+g+" of them — but they are paid for",
            "in sweat and sun-sickness. Everyone is the",
            "worse for it."]; } } ]);
}
function runEvent(){
  if(S.weather==="thunderstorm" && Math.random()<0.6){ stormEvent(); return; }
  if(S.weather==="blizzard" && Math.random()<0.6){ blizzardEvent(); return; }
  if(S.weather==="heat wave" && Math.random()<0.5){ heatChoice(); return; }
  if(Math.random()<0.45){
    const cs=CHOICE_EVENTS.filter(c=>c.ok());
    if(cs.length){ pick(cs).show(); return; }
  }
  const ev=pick(EVENTS);
  const lines=ev();
  setScreen({ lines, cont:()=>{ afterAction(()=>travelScreen()); } });
}
function showChoice(lines, opts){
  setScreen({ lines, menu: opts.map(o=>({ label:o.label, fn:()=>{
    const res=o.fn();
    setScreen({ lines:res, cont:()=>{ afterAction(()=>travelScreen()); } });
  }})) });
}

        return ["You measure out flour and bacon. The Pawnee",

          "you the firm ground. You travel easier for it."]; } },
      { label:"Refuse and roll on", fn:()=>{ addMorale(-3);
        if(Math.random()<0.4 && S.oxen>2){ S.oxen--;
          return ["You shake your head and roll on. That night",
            "an ox is missing from the herd — cut out",
            "quiet as you please. The toll would have",
            "been cheaper."]; }
        return ["You shake your head and roll on. The Pawnee",

          "quite soundly that night."]; } } ]) },
  { ok:()=>S.food>=40, show:()=>showChoice(
    ["A family's wagon sits by the trail with a broken",
     "axle, three days behind their train. The father",
     "asks, hat in hand, if you can spare any food."],
    [ { label:"Give them 40 pounds of food", fn:()=>{ S.food-=40; addMorale(10);
        if(Math.random()<0.5){ S.parts.wheel++;
          return ["You share out bacon and flour. The mother",
            "presses a spare wagon wheel into your hands —",
            "\"We can't pull it anyway. God go with you.\"",
            "","Your party travels lighter in spirit."]; }
        return ["You share out bacon and flour. They wave",
          "until your wagon is a speck on the horizon.",
          "","Your party travels lighter in spirit."]; } },
      { label:"You cannot spare it — roll on", fn:()=>{ addMorale(-4);
        return ["You shake your head and roll on. Nobody",
          "says much at supper that night."]; } } ]) },
  { ok:()=>S.money>=15, show:()=>showChoice(
    ["A traveling trader rides up with a pack mule",
     "loaded with bacon and flour. \"Trail prices,\" he",
     "grins. \"80 pounds of food for $15, cash.\""],
    [ { label:"Buy the food ($15)", fn:()=>{ S.money-=15; S.food+=80;
        return ["You haggle half-heartedly and load the",

      { label:"No deal — roll on", fn:()=>
        ["\"Suit yourself,\" he shrugs, and rides on",
         "toward the next wagon."] } ]) },
  { ok:()=>true, show:()=>showChoice(
    ["Smoke on the horizon — a prairie fire, driven by",

    [ { label:"Push the oxen hard to outrun it", fn:()=>{ S.miles+=RI(10,16);
        alive().forEach(p=>hurt(p,4)); addMorale(-3);
        return ["You whip the teams to a trot and race the",

      { label:"Stop and burn a firebreak", fn:()=>{ addDay(); eatDay(); addMorale(2);
        return ["You burn a wide black strip ahead of the",

          "not a hair on any head singed."]; } } ]) },
  { ok:()=>true, show:()=>showChoice(
    ["A lone rider catches up at dusk. \"There's a cutoff",
     "over the ridge,\" he says. \"Cuts a day off, easy.",
     "Course, it's rough as a cob.\" He rides on."],
    [ { label:"Take the rider's cutoff", fn:()=>{ if(Math.random()<0.55){ const g=RI(18,30); S.miles+=g;
          return ["The cutoff is rough but honest — you drop",
            "back to the trail a good "+g+" miles ahead.",
            "The rider knew his country."]; }
        if(S.oxen>2){ S.oxen--; return ["The cutoff is a dry, rutted scar. An ox",
          "gives out on the climb and has to be left.",
          "\"Rough as a cob\" was kindly put."]; }
        alive().forEach(p=>hurt(p,5));
        return ["The cutoff is a dry, rutted scar. Short of",
          "water, the party suffers through it and",
          "staggers back to the main trail."]; } },
      { label:"Stay on the main trail", fn:()=>{ addMorale(1);
        return ["You stick to the known trail. Slow and",
          "sure has buried fewer folks than clever."]; } } ]) },
];
const EVENTS=[
  function coldSpring(){
    addMorale(3); alive().forEach(p=>{ p.hp=clamp(p.hp+4,0,100); });
    return ["You find a cold, clear spring under the cotton-",
      "woods — the first sweet water in days. The party",
      "drinks deep, fills every keg, and rests an hour",
      "in the shade, much refreshed."];
  },
  function miredInMud(){
    if(guideLeft()>0)
      return ["The trail turns to gumbo after the rain, but",
        "your guide picks the firm line through it, and",
        "the wagon never once sinks to the hubs."];
    addDay(); eatDay();
    return ["The trail turns to gumbo, and the wagon sinks",
      "to its hubs again and again. You dig, pry and",
      "double-team the oxen until dark. A day is lost",
      "to the mud."];
  },
  function bitingFlies(){
    addMorale(-4); alive().forEach(p=>hurt(p,1));
    return ["Mosquitoes and biting green flies torment the",
      "party from dawn to dark — in your eyes, your",
      "ears, your food. Even the oxen stamp and toss.",
      "Tempers run short all day."];
  },
  function brokenPart(){
    const part=pick(["wheel","axle","tongue"]);
    if(S.parts[part]>0){ S.parts[part]--;
      return ["Your wagon "+(part==="wheel"?"wheel breaks":part==="axle"?"axle cracks":"tongue snaps")+".",
        "","Luckily, you have a spare "+PARTNAME[part]+".",
        "You fit the spare and roll on, losing half a day."]; }
    addDay(); eatDay();
    return ["Your wagon "+(part==="wheel"?"wheel breaks":part==="axle"?"axle cracks":"tongue snaps")+".",
      "","You have no spare "+PARTNAME[part]+". You spend a hard",
      "day making a repair with green wood and rope.",
      "It will hold — probably. You lose a full day."];
  },
  function oxDies(){
    if(S.oxen>0) S.oxen--;
    return ["One of your oxen lies down in the traces and",
      "cannot get up. By evening it is dead.",
      "","You have "+S.oxen+" oxen left."];
  },
  function oxWanders(){
    addDay(); eatDay();
    if(Math.random()<0.25 && S.oxen>0){ S.oxen--;
      return ["Your oxen wander off in the night. You spend a",
        "day searching, but one of them is never found.",
        "","You have "+S.oxen+" oxen left."]; }
    return ["Your oxen wander off in the night. You spend a",
      "long, anxious day finding them and driving them",
      "back to camp. You lose a day's travel."];
  },
  function disease(){
    const p=pick(alive()); if(!p) return ["The trail is quiet today."];
    const dz=pick(DISEASES); hurt(p,8,dz);
    return [p.name+" is feeling very sick.",
      "","The others say it looks like "+dz+"."];
  },
  function snakebite(){
    const p=pick(alive()); if(!p) return ["The trail is quiet today."];
    hurt(p,18,"a snakebite");
    return [p.name+" steps on a rattlesnake at the edge of camp.",
      "","The bite is ugly and swollen. "+p.name+" must ride",
      "in the wagon while the poison works through."];
  },
  function brokenBone(){
    const p=pick(alive()); if(!p) return ["The trail is quiet today."];
    const bone=Math.random()<0.5?"arm":"leg"; hurt(p,22,"a broken "+bone);
    return [p.name+" falls from the wagon tongue and breaks a "+bone+".",
      "","You set the bone as best you can. "+p.name+" will",
      "ride in the wagon for a good while."];
  },
  function badWater(){
    alive().forEach(p=>hurt(p,5));
    return ["The water at last night's camp was bad — alkaline",
      "and foul. The whole party is sick to their stomachs",
      "and weak on their feet today."];
  },
  function noGrass(){
    S.grassBad=2;
    return ["The grass here is poor and eaten down to the",
      "roots by the wagons ahead of you. Your oxen go",
      "hungry, and hungry oxen pull slow."];
  },
  function fog(){
    addDay(); eatDay();
    return ["Heavy fog rolls in off the river bottoms. You",
      "cannot see the trail markers, and dare not travel.",
      "You lose a full day waiting for it to lift."];
  },
  function hail(){
    addDay(); eatDay(); alive().forEach(p=>hurt(p,3));
    if(S.food>0) S.food=Math.max(0,S.food-8);
    return ["A hail storm batters the wagon — stones the size",
      "of hen's eggs! The party huddles under the canvas",
      "until it passes. Some flour is spoiled by the wet."];
  },
  function helpfulIndians(){
    const amt=RI(40,100); S.food+=amt;
    return ["A band of Indians rides into camp. They are",
      "friendly, and after much smiling and sign talk",
      "they give you "+amt+" pounds of dried meat and roots.",
      "You thank them the best you can."];
  },
  function abandonedWagon(){
    const found=pick(["food","bullets","clothing","part"]);
    if(found==="food"){ const a=RI(30,90); S.food+=a;
      return ["You pass an abandoned wagon, its team gone.",
        "Inside you find "+a+" pounds of food, still good."]; }
    if(found==="bullets"){ S.bullets+=20;
      return ["You pass an abandoned wagon, its team gone.",
        "Inside you find a box of 20 bullets."]; }
    if(found==="clothing"){ S.clothing+=1;
      return ["You pass an abandoned wagon, its team gone.",
        "Inside you find a set of warm clothing."]; }
    const part=pick(["wheel","axle","tongue"]); S.parts[part]++;
    return ["You pass an abandoned wagon, its team gone.",
      "Its "+PARTNAME[part]+" is sound. You take it along."];
  },
  function thief(){
    if(S.food>=40){ const a=RI(25,70); S.food-=a;
      return ["In the night, a thief slips into camp and makes",
        "off with "+a+" pounds of your food. The watch",
        "hears nothing but the wind."]; }
    if(S.bullets>=20){ S.bullets-=20;
      return ["In the night, a thief slips into camp and steals",
        "a box of your bullets."]; }
    return ["You hear a noise in the night — a thief, scared",
      "off before he could take anything of value."];
  },
  function wildFruit(){
    if(S.date.m>=6&&S.date.m<=9){ const a=RI(15,40); S.food+=a;
      return ["The children find wild plums and berries along",
        "the creek. You gather "+a+" pounds of fruit —",
        "a welcome change from bacon and beans."]; }
    return ["A cold wind blows all day. The party wraps up",
      "in blankets and trudges on in silence."];
  },
  function exhaustion(){
    const p=pick(alive()); if(!p) return ["The trail is quiet today."];
    hurt(p,12,"exhaustion");
    return ["The pace and the endless walking wear "+p.name+" down.",
      p.name+" collapses by the wagon at noon and must",
      "be lifted into the back to rest."];
  },
  function dustStorm(){
    addDay(); eatDay(); addMorale(-3);
    return ["A dust storm rolls off the plains and swallows",
      "the trail. You unhitch and sit it out, grit in",
      "your teeth and your food. A whole day is lost."];
  },
  function wagonTrain(){
    addMorale(6); alive().forEach(p=>{ p.hp=clamp(p.hp+2,0,100); });
    return ["Another wagon train camps beside yours for the",
      "night. There is music, news from back home, and",
      "shared coffee. Everyone sleeps easier in company."];
  },
  function snakeBite(){
    const p=pick(alive()); if(!p) return ["The trail is quiet today."];
    hurt(p,12,"a snake bite");
    return ["A rattlesnake strikes from the grass — "+p.name,
      "is bitten on the ankle. You cut the wound, bind",
      "it tight, and pray the swelling stays down."];
  },
];

/* ============================== river crossings ============================== */
function setupRiver(lm){
  let depth=lm.base + R(-0.4,0.7);
  if(S.date.m>=4&&S.date.m<=6) depth+=1.1;            /* spring snowmelt */
  if(S.date.m===3) depth+=0.6;
  if(S.rainUp) depth+=0.6;
  S.riverDepth=Math.round(clamp(depth,1.2,7)*10)/10;
  S.riverWidth=RI(400,1000);
  riverScreen(lm,[]);
}
function riverScreen(lm, extra){
  const menu=[
    {label:"Attempt to ford the river", fn:()=>crossRiver(lm,"ford")},
    {label:"Caulk the wagon and float it across", fn:()=>crossRiver(lm,"caulk")},
  ];
  if(lm.ferry) menu.push({label:"Take the ferry ("+money(lm.ferry)+")",
    disabled:S.money<lm.ferry, fn:()=>crossRiver(lm,"ferry")});
  if(lm.guide) menu.push({label:"Hire an Indian guide (3 sets of clothing)",
    disabled:S.clothing<3, fn:()=>crossRiver(lm,"guide")});
  menu.push({label:"Wait to see if conditions improve", fn:()=>waitRiver(lm)});
  setScreen({ art:ART.river, lines:[].concat(extra,[
    lm.desc,"",
    "The "+lm.river+" is "+S.riverWidth+" feet across here.",
    "The water is "+S.riverDepth.toFixed(1)+" feet deep in the middle.",
    "",
    "You may:",
  ]), menu });
}
function waitRiver(lm){
  addDay(); eatDay(); pickWeather();
  const t=Math.random();
  if(t<0.5) S.riverDepth=Math.round(clamp(S.riverDepth-R(0.3,0.9),1.2,7)*10)/10;
  else if(t<0.7) S.riverDepth=Math.round(clamp(S.riverDepth+R(0.2,0.5),1.2,7)*10)/10;
  const msg=["You camp by the river and wait a day.",
    "The water now stands at "+S.riverDepth.toFixed(1)+" feet deep."];
  if(checkDeaths(()=>riverScreen(lm,msg))) return;
  if(winterCheck()) return;
  riverScreen(lm,msg);
}
function crossRiver(lm, method){
  addDay(); eatDay();
  if(method==="ferry") S.money-=lm.ferry;
  if(method==="guide") S.clothing-=3;
  const d=S.riverDepth;
  let p;
  if(method==="ford")       p = d<=2.5?0.95 : d<=3.5?0.75 : d<=4.5?0.50 : 0.30;
  else if(method==="caulk") p = d<=3?0.90   : d<=4.5?0.75 : d<=6?0.55   : 0.40;
  else if(method==="ferry") p = 0.98;
  else /* guide */           p = 0.92;
  const guided = guideLeft()>0 && (method==="ford"||method==="caulk");
  if(guided) p=Math.min(0.99, p+0.12);
  const lines=[];
  if(method==="ford") lines.push("You drive the oxen into the water and ford the "+lm.river+"...");
  if(method==="caulk") lines.push("You caulk the wagon box with tar and pitch, lash it fast,","and float it across the "+lm.river+" like a boat...");
  if(method==="ferry") lines.push("You pay the ferryman and ride his flatboat across the "+lm.river+".");
  if(method==="guide") lines.push("The Shoshone guide studies the water, then leads your","oxen in at a place you would never have chosen...");
  if(guided) lines.push("Your trail guide picks the crossing place with a practiced eye.");
  if(Math.random()<p){
    lines.push("", "You make it across safely. The far bank, at last.");
    S.lm++;
    setScreen({ lines, cont:()=>{ afterAction(()=>travelScreen()); } });
    return;
  }
  /* trouble in the water */
  lines.push("", "Halfway across, the current catches the wagon —");
  const losses=[];
  if(S.food>0){ const a=Math.min(S.food, RI(40,150)); S.food-=a; losses.push(a+" pounds of food"); }
  if(Math.random()<0.6&&S.clothing>0){ const a=RI(1,Math.max(1,S.clothing)); S.clothing-=a; losses.push(a+" set(s) of clothing"); }
  if(Math.random()<0.5&&S.bullets>=20){ S.bullets-=20; losses.push("a box of bullets"); }
  if(Math.random()<0.4){ const part=pick(["wheel","axle","tongue"]);
    if(S.parts[part]>0){ S.parts[part]--; losses.push("a spare "+PARTNAME[part]); } }
  if(losses.length) lines.push("the wagon swamps! You lose: "+losses.join(", ")+".");
  else lines.push("the wagon swamps and ships a deal of water,","but by some mercy nothing is lost.");
  const drownRisk = (method==="ferry" ? 0.02 : d>=4.5 ? 0.30 : d>=3.5 ? 0.15 : 0.05) * (guided?0.5:1);
  if(Math.random()<drownRisk && alive().length){
    const p2=pick(alive()); hurt(p2,999,"drowning");
    lines.push("", "In the struggle for the bank, "+p2.name+" is swept away.");
  } else {
    lines.push("", "Soaked and shaken, you drag the wagon out on the far bank.");
  }
  S.lm++;
  setScreen({ lines, cont:()=>{ afterAction(()=>travelScreen()); } });
}

/* ============================== The Dalles ============================== */
function dallesScreen(lm){
  S.lm++;
  setScreen({ art:ART.river, lines:[lm.desc,"",
    "The toll road costs $10. The river costs nothing —",
    "but the Columbia has swallowed wagons before."],
    menu:[
      {label:"Take the Barlow Toll Road ($10)", disabled:S.money<10, fn:()=>{
          S.money-=10;
          travelScreen(["You pay the toll and take the Barlow Road around",
            "Mount Hood. It is rough and steep, but it is a road.",
            "The Willamette Valley lies just ahead."]);
        }},
      {label:"Raft the Columbia River", fn:raftColumbia},
    ] });
}
function raftColumbia(){
  addDay(); eatDay();
  const lines=["You lash your wagon onto a rough log raft and push",
    "out into the Columbia. The river takes you swiftly",
    "down between walls of black rock..."];
  const t=Math.random();
  if(t<0.62){
    lines.push("", "The raft holds! You sweep down past the rapids and",
      "into calm water. Below you, green and gold, lies",
      "the Willamette Valley.");
  } else if(t<0.88){
    const a=Math.min(S.food, RI(50,150)); S.food-=a;
    if(S.bullets>=20) S.bullets-=20;
    lines.push("", "A rock tears at the raft and the wagon tips half",
      "into the river. You save the wagon, but lose "+a+" pounds",
      "of food and a box of bullets to the current.");
  } else if(alive().length){
    const p2=pick(alive()); hurt(p2,999,"drowning");
    lines.push("", "The raft breaks up in the rapids. You drag yourselves",
      "ashore, half drowned — but "+p2.name+" does not come up.");
  }
  S.miles=2040;
  setScreen({ lines, cont:()=>{ afterAction(()=>winGame()); } });
}

/* ============================== hunting ============================== */
const HUNT={active:false, animal:null, appearAt:0, shots:0, t1:0, t2:0, meat:0};
function startHunt(){
  if(S.bullets<=0){
    setScreen({ lines:["You have no bullets. There is no use hunting",
      "without ammunition."], cont:()=>travelScreen() });
    return;
  }
  HUNT.active=true; HUNT.shots=0; HUNT.meat=0; HUNT.animal=null;
  huntScreen(["You set out from the wagon with your rifle.",
    "Game is about — if you are quick. When an animal",
    "appears, SHOOT at once (tap SHOOT, or press SPACE",
    "or B). Do not shoot at shadows: a wasted bullet",
    "scares the game away."]);
  scheduleAnimal();
}
function huntScreen(lines){
  setScreen({ lines:lines.concat(["",
    "Bullets left: "+S.bullets+"    Shots taken: "+HUNT.shots+"    Meat gained: "+HUNT.meat+" pounds"]),
    menu:[{label:"Give up hunting and return to the wagon", fn:endHunt}] });
  $("shoot").classList.add("on");
}
function scheduleAnimal(){
  clearTimeout(HUNT.t1); clearTimeout(HUNT.t2);
  HUNT.animal=null;
  HUNT.t1=setTimeout(()=>{
    HUNT.animal=pick(ANIMALS); HUNT.appearAt=Date.now();
    $("art").style.display="block";
    $("art").textContent=ART[HUNT.animal.id]||"";
    $("text").innerHTML="A "+HUNT.animal.name.toUpperCase()+"!\n\nSHOOT — NOW!";
    HUNT.t2=setTimeout(()=>{
      if(HUNT.animal){ const a=HUNT.animal; HUNT.animal=null;
        huntScreen(["The "+a.name+" is gone before you can fire.",
          "The brush swallows it up."]);
        if(HUNT.shots<4&&S.bullets>0) scheduleAnimal(); else endHuntSoon();
      }
    }, HUNT.animal.window);
  }, R(900,2600));
}
function endHuntSoon(){ HUNT.t1=setTimeout(endHunt, 1200); }
function huntShoot(){
  if(!HUNT.active) return;
  if(S.bullets<=0){ huntScreen(["Your rifle clicks on an empty chamber. You are out of bullets."]); endHuntSoon(); return; }
  S.bullets--; HUNT.shots++;
  clearTimeout(HUNT.t2);
  if(!HUNT.animal){
    huntScreen(["BANG! You shot at a shadow — nothing there but",
      "wind in the brush. The noise will have scared",
      "off anything close."]);
    if(HUNT.shots<4&&S.bullets>0) scheduleAnimal(); else endHuntSoon();
    return;
  }
  const a=HUNT.animal; HUNT.animal=null;
  const reaction=Date.now()-HUNT.appearAt;
  let p=a.base + (1-clamp(reaction/a.window,0,1))*0.25 - 0.08;
  p=clamp(p,0.1,0.95);
  if(Math.random()<p){
    const carried=Math.min(a.meat,100);
    HUNT.meat+=carried; S.food+=carried;
    const extra=a.meat>100 ? "\nYou got "+a.meat+" pounds of meat, but you can only\ncarry 100 pounds of it back to the wagon." : "";
    huntScreen(["BANG! You killed the "+a.name+".",
      "You dress out "+carried+" pounds of meat."+extra]);
  } else {
    huntScreen(["BANG! You missed the "+a.name+".",
      "It vanishes into the brush, unharmed."]);
  }
  if(HUNT.shots<4&&S.bullets>0) scheduleAnimal(); else endHuntSoon();
}
$("shoot").addEventListener("click", huntShoot);
function endHunt(){
  if(!HUNT.active) return;
  HUNT.active=false; clearTimeout(HUNT.t1); clearTimeout(HUNT.t2);
  addDay(); const fed=eatDay(); pickWeather();
  const lines=["You return to the wagon with "+HUNT.meat+" pounds of meat.",
    "The hunt took the rest of the day."];
  if(!fed) lines.push("There is nothing else to eat tonight.");
  afterAction(()=>travelScreen(lines));
}

/* ============================== the end of the trail ============================== */
function winGame(){
  S.won=true; S.over=true;
  const rows=[]; let subtotal=0;
  const val={good:500, fair:400, poor:300, "very poor":200};
  alive().forEach(p=>{ const v=val[hpWord(p.hp)]; subtotal+=v;
    rows.push("  "+p.name+" arrives in "+hpWord(p.hp)+" health".padEnd(0,"")+": "+v); });
  const add=(label,v)=>{ subtotal+=v; rows.push("  "+label+": "+v); };
  add("Wagon still rolling", 50);
  add("Oxen ("+S.oxen+" at 100 each)", S.oxen*100);
  add("Spare parts ("+(S.parts.wheel+S.parts.axle+S.parts.tongue)+" at 10 each)",
      (S.parts.wheel+S.parts.axle+S.parts.tongue)*10);
  add("Clothing ("+S.clothing+" sets at 10 each)", S.clothing*10);
  add("Food ("+Math.round(S.food)+" pounds)", Math.floor(S.food/25));
  add("Bullets ("+S.bullets+")", Math.floor(S.bullets/50));
  add("Cash ("+money(S.money)+")", Math.floor(S.money/5));
  add("Party morale ("+moraleWord()+")", Math.round(morale()*2));
  const total=subtotal*S.mult;
  const prevBest=bestScore(); const isBest=total>prevBest;
  if(isBest) setBest(total);
  clearSave();
  setScreen({ art:ART.mountains, lines:[
    "CONGRATULATIONS!",
    "",
    "You have finally arrived in the Willamette Valley",
    "of Oregon, after "+S.days+" days on the trail.",
    "",
    "Your party stands on a green hillside, looking down",
    "at farms, orchards and the wide river. You made it.",
    "",
    "SCORE",
    "",
  ].concat(rows,[
    "",
    "Subtotal: "+subtotal,
    "Occupation bonus ("+(S.occ||"")+", x"+S.mult+"): ",
    "TOTAL SCORE: "+total,
    isBest ? "*** A NEW BEST SCORE! ***" : "Best score so far: "+Math.max(prevBest,total),
  ]),
  menu:[{label:"Play again", fn:()=>{ S=newGame(); titleScreen(); }}] });
}

/* ============================== test hooks + init ============================== */
window.OT={ get S(){ return S; }, get buttons(){ return BTNS; },
  press(label){ const b=BTNS.find(x=>x.label.includes(label)); if(!b) throw new Error("no button: "+label); if(!b.disabled) b.fn(); },
  space(){ if(UI.cont){ const f=UI.cont; UI.cont=null; f(); } },
  type(v){ $("entry").value=v; entryOk(); },
  startHunt, huntShoot, continueTrail, crossRiver, travelScreen, titleScreen,
  LANDMARKS, ITEMS, OCC };
titleScreen();
</script>

name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a build-machine Python matching the app's Python version.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"

      - name: Gateway smoke test
        run: GATEWAY_LITE=1 python gateway.py --db /tmp/ci.db simulate --n 60 > /dev/null

      - name: Build info and signing key
        env:
          KS_B64: ${{ secrets.MCUBED_KEYSTORE_B64 }}
          ADI_REGISTRATION: ${{ vars.ADI_REGISTRATION }}
        run: |
          printf '{"commit": "%s", "built_at": "%s", "run": %s, "ref": "%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_RUN_NUMBER" "$GITHUB_REF_NAME" > build_info.json
          if [ -n "$KS_B64" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mcubed.p12"; echo "MCUBED_KEYSTORE_FILE=$RUNNER_TEMP/mcubed.p12" >> "$GITHUB_ENV"; fi
          # Android developer verification: the ownership snippet from the Android Developer Console (repo variable ADI_REGISTRATION).
          if [ -n "$ADI_REGISTRATION" ]; then mkdir -p android/app/src/main/assets; printf '%s\n' "$ADI_REGISTRATION" > android/app/src/main/assets/adi-registration.properties; echo "added adi-registration.properties"; fi

      - name: Build APK
        working-directory: android
        env:
          MCUBED_KEYSTORE_PASSWORD: ${{ secrets.MCUBED_KEYSTORE_PASSWORD }}
          MCUBED_KEY_ALIAS: ${{ secrets.MCUBED_KEY_ALIAS }}
          MCUBED_VERSION_CODE: ${{ github.run_number }}
          MCUBED_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.1.{0}', github.run_number) }}
        run: gradle --no-daemon assembleDirectRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MCUBED-${{ github.run_number }}.apk

      - name: Verify the APK is signed with the MCUBED key
        if: github.event_name != 'pull_request'
        run: |
          GATEWAY_LITE=1 python -c "import gateway as g, glob, sys; s = g.apk_signer_sha256(glob.glob('MCUBED-*.apk')[0]); f = glob.glob('MCUBED-*.apk')[0]; v = g.apk_signature_schemes(f); print('signer', s, 'schemes', v); sys.exit('APK is not signed with the MCUBED key' if s != [g.MCUBED_CERT_SHA256] else 'missing signature schemes: ' + str(v) if not {'v1', 'v2', 'v3'} <= set(v) else 0)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MCUBED-apk
          path: MCUBED-*.apk
          retention-days: 3

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: MCUBED-*.apk

      - name: Publish "MCUBED install" release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable file names so the install links never change.
          cp MCUBED-*.apk MCUBED.apk
          git archive --format=zip --prefix=MCUBED/ -o MCUBED-desktop.zip HEAD
          # include build_info.json so a fresh download knows its version and can update itself
          mkdir -p zipadd/MCUBED && cp build_info.json zipadd/MCUBED/ && (cd zipadd && zip -q ../MCUBED-desktop.zip MCUBED/build_info.json)
          SHORT=${GITHUB_SHA::7}
          APK_SHA=$(sha256sum MCUBED.apk | cut -d' ' -f1)
          echo "$APK_SHA  MCUBED.apk" > MCUBED.apk.sha256
          CERT=$(GATEWAY_LITE=1 python -c "import gateway as g; c = g.MCUBED_CERT_SHA256.upper(); print(':'.join(c[i:i+2] for i in range(0, 64, 2)))")
          REPO_URL="https://github.com/$GITHUB_REPOSITORY"
          cat > notes.md <<NOTES
          ## Android
          1. On your phone, open [MCUBED.apk]($REPO_URL/releases/download/latest/MCUBED.apk).
          2. Allow your browser to install apps when Android asks, then tap Install.
          3. Later updates install from the app's Update tab.

          ## Windows, Mac or Linux
          1. Install Python 3.10 or newer.
          2. Download [MCUBED-desktop.zip]($REPO_URL/releases/download/latest/MCUBED-desktop.zip) and unzip it.
          3. In the MCUBED folder run \`python gateway.py gui\` and open http://localhost:8765.

          ## Check that your download is genuine
          - APK SHA-256: \`$APK_SHA\`
          - Signed by the MCUBED key, certificate SHA-256: \`$CERT\`
          - Android only installs updates signed by this same key, and the in-app updater checks both values before installing.

          Build $SHORT, run $GITHUB_RUN_NUMBER, $(date -u '+%Y-%m-%d %H:%M UTC'). This release is refreshed automatically on every update to main.
          NOTES
          sed -i 's/^          //' notes.md
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Move the tag to this commit and replace the files in place, so the links keep working during the update.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
            gh release upload latest MCUBED.apk MCUBED.apk.sha256 MCUBED-desktop.zip --clobber -R "$GITHUB_REPOSITORY"
            for a in $(gh release view latest -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              case "$a" in MCUBED.apk|MCUBED.apk.sha256|MCUBED-desktop.zip) ;; *) gh release delete-asset latest "$a" -y -R "$GITHUB_REPOSITORY" ;; esac
            done
            gh release edit latest -R "$GITHUB_REPOSITORY" --title "MCUBED install" --notes-file notes.md --prerelease=false --latest --target "$GITHUB_SHA"
          else
            gh release create latest MCUBED.apk MCUBED.apk.sha256 MCUBED-desktop.zip -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MCUBED install" --notes-file notes.md --latest
          fi
